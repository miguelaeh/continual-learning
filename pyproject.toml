[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-memory-continual-learning"
version = "0.1.0"
description = "Sparse Memory Finetuning for Continual Learning on Gemma 3 4B"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.53.0",
    "datasets>=2.14.0",
    "omegaconf>=2.3.0",
    "einops>=0.7.0",
    "accelerate>=0.25.0",
    "safetensors>=0.4.0",
    "wandb>=0.16.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
