# Warm-start pretraining: initialize from distilled checkpoint, then train with LM loss.
# This combines fast distillation convergence with proper end-to-end slot structure.

memory:
  num_heads: 4
  top_k: 32
  n_keys: 1024
  k_dim_per_head: 512
  v_dim: 1024
  memory_layers: [9, 17, 25]
  use_silu_gating: true

pretrain:
  base_model: "google/gemma-3-4b-it"
  memory_checkpoint: "checkpoints/distill/memory_layers.pt"
  learning_rate: 1.0e-4
  value_learning_rate: 1.0e-3
  warmup_steps: 200
  total_steps: 2500
  batch_size: 2
  gradient_accumulation_steps: 16
  seq_length: 2048
  weight_decay: 0.1
  gradient_clip: 1.0
  dtype: "bfloat16"
  dataset: "HuggingFaceFW/fineweb-edu"
  dataset_subset: "default"
  checkpoint_dir: "checkpoints/pretrain_warmstart"
  save_every_steps: 500
  log_every_steps: 50
  seed: 42
