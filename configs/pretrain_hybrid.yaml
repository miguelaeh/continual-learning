# Hybrid pretraining: LM loss + MSE distillation
# Uses Gemma 3 1B for faster iteration, single memory layer at position 13.

memory:
  num_heads: 4
  top_k: 32
  n_keys: 64               # 4K entries — many more gradient hits per slot
  k_dim_per_head: 512
  v_dim: 1024
  memory_layers: [13]       # Single layer, middle of 26 (1B model)
  use_silu_gating: true

hybrid_pretrain:
  base_model: "google/gemma-3-1b-it"
  learning_rate: 5.0e-4       # Higher LR — direct MSE signal allows it
  value_learning_rate: 5.0e-3
  warmup_steps: 200
  total_steps: 10000
  batch_size: 4
  gradient_accumulation_steps: 4
  seq_length: 2048
  weight_decay: 0.1
  gradient_clip: 1.0
  dtype: "bfloat16"
  dataset: "mlfoundations/dclm-baseline-1.0"
  dataset_subset: "default"
  checkpoint_dir: "checkpoints/pretrain_hybrid"
  save_every_steps: 1000
  log_every_steps: 10
  seed: 42
  mse_alpha_start: 100.0       # Balance MSE and LM gradients
  mse_alpha_end: 0.0           # Decay to 0 (pure LM loss for slot structure)
  mse_warmup_steps: 2000       # Bootstrap phase before annealing
