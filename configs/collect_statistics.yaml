memory:
  num_heads: 4
  top_k: 32
  n_keys: 1024
  k_dim_per_head: 512
  v_dim: 1024
  memory_layers: [9, 17, 25]
  use_silu_gating: true

collection:
  base_model: "google/gemma-3-4b-it"
  memory_checkpoint: "checkpoints/pretrain/memory_layers.pt"
  num_background_batches: 100
  batch_size: 2
  seq_length: 2048
  dtype: "bfloat16"
  dataset: "HuggingFaceFW/fineweb-edu"
  dataset_subset: "default"
  output_path: "checkpoints/idf_statistics.pt"
  seed: 42
