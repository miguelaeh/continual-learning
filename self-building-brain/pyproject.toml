[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-building-brain"
version = "0.1.0"
description = "Prototype for continual learning via persistent latent brain state updates."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "transformers>=4.45",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
