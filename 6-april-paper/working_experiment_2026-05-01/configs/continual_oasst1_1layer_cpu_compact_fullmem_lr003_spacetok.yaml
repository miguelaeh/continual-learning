model:
  model_name: "Qwen/Qwen2.5-0.5B-Instruct"
  dtype: "bfloat16"
  device_map: "cpu"
  local_files_only: false

memory:
  num_heads: 4
  top_k: 8
  n_keys: 128
  k_dim_per_head: 256
  v_dim: 128
  num_memory_layers: 1
  memory_layers: [11]
  use_silu_gating: true

data:
  path: "data/continual_miguel_compact.jsonl"
  text_field: "text"
  seq_length: 16
  batch_size: 1
  pack_samples: false
  max_samples: 256
  shuffle: true
  seed: 42

recovery:
  eval_data_path: "data/recovery_eval_sample.jsonl"
  sanity_prompts_path: "data/recovery_prompts.json"

continual:
  learning_rate: 0.003
  optimizer: "adamw"
  total_steps: 20
  log_every_steps: 10
  save_every_steps: 10
  gradient_clip: 0.5
  output_dir: "checkpoints/continual_oasst1_1layer_cpu_compact_fullmem_lr003_spacetok"
  train_full_memory: true
  top_t: 512
  selector: "tfidf"
  background_stats_path: "checkpoints/background_oasst1_1layer_cpu_stats.pt"
  recovery_checkpoint: "checkpoints/recovery_oasst1_1layer_300/memory_step_300.pt"
  require_recovery_pass: true
  recovery_eval_data_path: "data/recovery_eval_sample.jsonl"
  recovery_eval_max_batches: 10
  recovery_max_loss_delta_vs_base: 0.75
  recovery_max_loss_ratio_vs_base: 1.15
  require_recovery_prompt_checks: true
