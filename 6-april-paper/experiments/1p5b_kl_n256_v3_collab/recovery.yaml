model:
  model_name: "Qwen/Qwen2.5-1.5B-Instruct"
  dtype: "bfloat16"
  device_map: "auto"
  local_files_only: false

memory:
  num_heads: 4
  top_k: 8
  n_keys: 256
  k_dim_per_head: 256
  v_dim: 128
  num_memory_layers: 1
  memory_layers: [14]
  use_silu_gating: true

data:
  dataset_name: "OpenAssistant/oasst1"
  split: "train"
  text_field: "text"
  streaming: false
  shuffle: true
  shuffle_buffer: 10000
  max_samples: 10000
  seq_length: 256
  batch_size: 1
  num_workers: 0
  seed: 42

recovery:
  learning_rate: 0.0001
  total_steps: 2000
  warmup_steps: 100
  gradient_accumulation_steps: 8
  log_every_steps: 50
  save_every_steps: 500
  gradient_clip: 1.0
  output_dir: "experiments/1p5b_kl_n256_v3_collab/checkpoints/recovery"
  eval_data_path: "data/recovery_eval_sample.jsonl"
  eval_max_batches: 10
  sanity_prompts_path: "data/recovery_prompts.json"
  max_loss_delta_vs_base: 0.75
  max_loss_ratio_vs_base: 1.15
  require_prompt_checks: true
