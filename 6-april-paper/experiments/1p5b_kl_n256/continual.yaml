model:
  model_name: "Qwen/Qwen2.5-1.5B-Instruct"
  dtype: "bfloat16"
  device_map: null
  local_files_only: false

memory:
  num_heads: 4
  top_k: 8
  n_keys: 256
  k_dim_per_head: 256
  v_dim: 128
  num_memory_layers: 1
  memory_layers: [14]
  use_silu_gating: true

data:
  path: "data/april6_triviaqa_train_1k.jsonl"
  text_field: "text"
  seq_length: 128
  batch_size: 1
  pack_samples: false
  max_samples: null
  shuffle: true
  seed: 42

recovery:
  eval_data_path: "data/recovery_eval_sample.jsonl"
  sanity_prompts_path: "data/recovery_prompts.json"

continual:
  learning_rate: 1.0
  optimizer: "sgd"
  total_steps: 1000
  log_every_steps: 50
  save_every_steps: 200
  gradient_clip: 0.5
  output_dir: "experiments/1p5b_kl_n256/checkpoints/continual"
  top_t: 500
  selector: "kl"
  selection_supervised_only: false
  background_stats_path: "experiments/1p5b_kl_n256/checkpoints/background_stats.pt"
  recovery_checkpoint: "experiments/1p5b_kl_n256/checkpoints/recovery/memory.pt"
  require_recovery_pass: true
  recovery_eval_data_path: "data/recovery_eval_sample.jsonl"
  recovery_eval_max_batches: 10
  recovery_max_loss_delta_vs_base: 1.5
  recovery_max_loss_ratio_vs_base: 1.25
  require_recovery_prompt_checks: true
