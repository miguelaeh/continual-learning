model:
  model_name: "/Users/miguelaeh/projects/continual-learning-experiments/6-april-paper/local_models/Qwen2.5-1.5B-Instruct"
  dtype: "bfloat16"
  device_map: "cpu"
  local_files_only: true

memory:
  num_heads: 4
  top_k: 8
  n_keys: 128
  k_dim_per_head: 256
  v_dim: 128
  num_memory_layers: 1
  memory_layers: [14]
  use_silu_gating: true

data:
  path: "data/continual_miguel_qa.jsonl"
  text_field: "text"
  seq_length: 16
  batch_size: 1
  pack_samples: false
  max_samples: 256
  shuffle: true
  seed: 42

recovery:
  eval_data_path: "data/recovery_eval_sample.jsonl"
  sanity_prompts_path: "data/recovery_prompts.json"

continual:
  learning_rate: 0.003
  optimizer: "adamw"
  total_steps: 6
  log_every_steps: 1
  save_every_steps: 2
  gradient_clip: 0.5
  output_dir: "checkpoints/continual_oasst1_1layer_cpu_qa_fullmem_lr003_1p5b_mini"
  train_full_memory: true
  top_t: 512
  selector: "tfidf"
  background_stats_path: "checkpoints/background_oasst1_1layer_1p5b_mini_stats.pt"
  recovery_checkpoint: "checkpoints/recovery_oasst1_1layer_1p5b_mini/memory.pt"
  require_recovery_pass: false
  recovery_eval_data_path: "data/recovery_eval_sample.jsonl"
  recovery_eval_max_batches: 5
  recovery_max_loss_delta_vs_base: 2.0
  recovery_max_loss_ratio_vs_base: 2.0
  require_recovery_prompt_checks: false
