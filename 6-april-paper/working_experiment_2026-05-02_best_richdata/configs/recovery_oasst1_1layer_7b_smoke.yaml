model:
  model_name: "Qwen/Qwen2-7B"
  dtype: "bfloat16"
  device_map: "cpu"
  local_files_only: true

memory:
  num_heads: 4
  top_k: 8
  n_keys: 128
  k_dim_per_head: 256
  v_dim: 128
  num_memory_layers: 1
  memory_layers: [14]
  use_silu_gating: true

data:
  path: "data/oasst1_train_4000_messages.jsonl"
  text_field: "messages"
  shuffle: true
  max_samples: 4000
  seq_length: 64
  batch_size: 1
  pack_samples: false
  seed: 42

recovery:
  learning_rate: 0.0001
  total_steps: 60
  warmup_steps: 6
  gradient_accumulation_steps: 1
  log_every_steps: 10
  save_every_steps: 20
  gradient_clip: 1.0
  output_dir: "checkpoints/recovery_oasst1_1layer_7b_smoke"
  eval_data_path: "data/recovery_eval_sample.jsonl"
  eval_max_batches: 10
  sanity_prompts_path: "data/recovery_prompts.json"
  max_loss_delta_vs_base: 1.5
  max_loss_ratio_vs_base: 1.5
  require_prompt_checks: false
