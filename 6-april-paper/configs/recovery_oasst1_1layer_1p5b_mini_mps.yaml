model:
  model_name: "/Users/miguelaeh/projects/continual-learning-experiments/6-april-paper/local_models/Qwen2.5-1.5B-Instruct"
  dtype: "bfloat16"
  device_map: "mps"
  local_files_only: true

memory:
  num_heads: 4
  top_k: 8
  n_keys: 128
  k_dim_per_head: 256
  v_dim: 128
  num_memory_layers: 1
  memory_layers: [14]
  use_silu_gating: true

data:
  path: "data/oasst1_train_4000_messages.jsonl"
  text_field: "messages"
  shuffle: true
  max_samples: 500
  seq_length: 64
  batch_size: 1
  pack_samples: false
  seed: 42

recovery:
  learning_rate: 0.0001
  total_steps: 4
  warmup_steps: 1
  gradient_accumulation_steps: 1
  log_every_steps: 1
  save_every_steps: 2
  gradient_clip: 1.0
  output_dir: "checkpoints/recovery_oasst1_1layer_1p5b_mini_mps"
  eval_data_path: "data/recovery_eval_sample.jsonl"
  eval_max_batches: 2
  sanity_prompts_path: "data/recovery_prompts.json"
  max_loss_delta_vs_base: 2.0
  max_loss_ratio_vs_base: 2.0
  require_prompt_checks: false
