model:
  model_name: "Qwen/Qwen2.5-0.5B-Instruct"
  dtype: "bfloat16"
  device_map: "cpu"
  local_files_only: false

memory:
  num_heads: 4
  top_k: 8
  n_keys: 128
  k_dim_per_head: 256
  v_dim: 128
  num_memory_layers: 1
  memory_layers: [11]
  use_silu_gating: true

data:
  path: "data/april6_triviaqa_train_1k.jsonl"
  text_field: "text"
  seq_length: 128
  batch_size: 1
  pack_samples: false
  max_samples: 1000
  shuffle: true
  seed: 42

recovery:
  eval_data_path: "data/recovery_eval_sample.jsonl"
  sanity_prompts_path: "data/recovery_prompts.json"

continual:
  learning_rate: 1.0
  optimizer: "sgd"
  total_steps: 80
  log_every_steps: 5
  save_every_steps: 5
  gradient_clip: 0.5
  output_dir: "checkpoints/baseline_paper_continual_qwen25_0p5b_kl_long"
  top_t: 64
  selector: "kl"
  selection_supervised_only: false
  background_stats_path: "checkpoints/baseline_paper_background_qwen25_0p5b_long_stats.pt"
  recovery_checkpoint: "checkpoints/baseline_paper_recovery_qwen25_0p5b_long/memory.pt"
  require_recovery_pass: true
  recovery_eval_data_path: "data/recovery_eval_sample.jsonl"
  recovery_eval_max_batches: 10
  recovery_max_loss_delta_vs_base: 0.75
  recovery_max_loss_ratio_vs_base: 1.15
  require_recovery_prompt_checks: true
