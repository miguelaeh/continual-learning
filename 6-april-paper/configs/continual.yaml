model:
  model_name: "Qwen/Qwen2.5-0.5B-Instruct"
  dtype: "bfloat16"
  device_map: "auto"
  local_files_only: false

memory:
  num_heads: 4
  top_k: 8
  n_keys: 128
  k_dim_per_head: 256
  v_dim: 128
  num_memory_layers: 3
  use_silu_gating: true

data:
  path: "data/continual_sample.jsonl"
  text_field: "text"
  seq_length: 64
  batch_size: 2
  max_samples: 128
  shuffle: true
  seed: 42

continual:
  learning_rate: 1.0
  optimizer: "sgd"
  total_steps: 50
  log_every_steps: 5
  save_every_steps: 25
  output_dir: "checkpoints/continual"
  top_t: 64
  selector: "kl"
  background_stats_path: "checkpoints/background_stats.pt"
  recovery_checkpoint: "checkpoints/recovery/memory.pt"
  require_recovery_pass: true
  recovery_eval_data_path: "data/recovery_eval_sample.jsonl"
  recovery_eval_max_batches: 10
  recovery_max_loss_delta_vs_base: 1.0
  recovery_max_loss_ratio_vs_base: 1.25
