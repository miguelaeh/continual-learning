model:
  model_name: "/Users/miguelaeh/projects/continual-learning-experiments/6-april-paper/local_models/Qwen2.5-1.5B-Instruct"
  dtype: "bfloat16"
  device_map: "cpu"
  local_files_only: true

memory:
  num_heads: 4
  top_k: 8
  n_keys: 128
  k_dim_per_head: 256
  v_dim: 128
  num_memory_layers: 1
  memory_layers: [14]
  use_silu_gating: true
  use_delta_bank: true
  use_delta_residual: true
  use_delta_value_proj: false
  delta_residual_init_scale: 1.0

data:
  path: "data/continual_identity_rich_interactions_v2_clean.jsonl"
  text_field: "text"
  seq_length: 128
  batch_size: 1
  pack_samples: false
  max_samples: 50
  shuffle: true
  seed: 42

recovery:
  eval_data_path: "data/recovery_eval_sample.jsonl"
  sanity_prompts_path: "data/recovery_prompts.json"

continual:
  learning_rate: 0.003
  optimizer: "adamw"
  total_steps: 40
  log_every_steps: 10
  save_every_steps: 10
  gradient_clip: 0.5
  output_dir: "checkpoints/continual_oasst1_1layer_deltagate_1p5b_richdata_v2_seq128"
  train_memory_mode: "delta_values_and_gate"
  top_t: 128
  selector: "kl"
  selection_supervised_only: true
  replay_select_union: false
  replay_select_difference: false
  post_backward_grad_top_k: 24
  background_stats_path: "checkpoints/background_oasst1_1layer_1p5b_mini_stats.pt"
  recovery_checkpoint: "checkpoints/recovery_oasst1_1layer_1p5b_mini/memory.pt"
  require_recovery_pass: true
  recovery_eval_data_path: "data/recovery_eval_sample.jsonl"
  recovery_eval_max_batches: 10
  recovery_max_loss_delta_vs_base: 0.75
  recovery_max_loss_ratio_vs_base: 1.15
  require_recovery_prompt_checks: true
